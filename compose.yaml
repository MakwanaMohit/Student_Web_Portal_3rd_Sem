services:
  db:
    image: mohitmakwana/studentmng-db
    expose:
      - 3306
      - 33060
    env_file:
      - .env 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$MYSQL_USER", "-p$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  web:
    image: mohitmakwana/studentmng:latest  
    command: gunicorn Student_Website.wsgi --bind=0.0.0.0:8000
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    entrypoint: >
      sh -c "
      python manage.py migrate &&
      gunicorn Student_Website.wsgi --bind=0.0.0.0:8000
      "
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  static_volume:
    driver: local

  media_volume:
    driver: local

